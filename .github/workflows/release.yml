name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Archive ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        target: [i686-elf, x86_64-elf]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Outils de build et de test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential m4 curl xz-utils bzip2 qemu-system-x86 grub-common

      - name: Toolchain, archive, licences, sources et tests
        env:
          TARGET: ${{ matrix.target }}
        run: ./release.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir assets
          cp dist/*/*.tar.xz dist/*/*.tar.xz.sha256 assets/
          cp dist/x86_64-elf/sources/* assets/
          gh release create "$TAG" assets/* --repo "$REPO" \
            --title "$TAG : GCC 15.3.0, binutils 2.47, i686-elf et x86_64-elf" \
            --notes "Cross-compilateurs i686-elf et x86_64-elf pour Linux x86_64, construits par GitHub Actions sur Ubuntu 24.04 (glibc 2.38 ou plus récente). En x86_64, une seconde libgcc compilée sans red zone est choisie avec -mno-red-zone. Les archives sources officielles (GCC, binutils, GMP, MPFR, MPC, ISL, gettext) sont jointes, comme le demande la GPL."
